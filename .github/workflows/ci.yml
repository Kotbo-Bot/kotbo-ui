name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (svelte-check)
        run: bun run check

      - name: Lint (eslint)
        run: bun run lint

      - name: Tests (bun test)
        run: bun test

      - name: Build package & showcase (svelte-package, publint, vite)
        run: bun run build
